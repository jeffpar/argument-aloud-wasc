title: Argument Aloud
tagline: WA Supreme Court Data
description: Case-related media (arguments, transcripts, recordings, opinions) for the Washington State Supreme Court. Consumed cross-origin by the Argument Aloud explorer at argumentaloud.org.
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
webrick:
  headers:
    Accept-Ranges: bytes
    Cache-Control: public, max-age=3600
    Access-Control-Allow-Origin: "*"
exclude:
  - .github/
  - .history/
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - config.json
  - package.json
  - package-lock.json
  - node_modules/
include:
  - .well-known
